version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules # Avoids overwriting node_modules by local copy
    environment:
      - NODE_ENV=development
      - MYSQL_HOST=mysql
      - MYSQL_USER=user
      - MYSQL_PASSWORD=password
      - MYSQL_DATABASE=dating_app_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - RABBITMQ_HOST=rabbitmq
      - ELASTICSEARCH_HOST=elasticsearch
      - ELASTICSEARCH_PORT=9200
    depends_on:
      - mysql
      - redis
      - rabbitmq
      - elasticsearch
    networks:
      - app-network

  frontend:
    build: ./frontend
    ports:
      - "8080:8080" # Assuming frontend runs on 8080 inside the container
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules # Avoids overwriting node_modules by local copy
    environment:
      - NODE_ENV=development
      # Add any frontend specific environment variables here
      # e.g., API_BASE_URL=http://localhost:3000/api
    depends_on:
      - backend
    networks:
      - app-network

  mysql:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: dating_app_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app-network

  redis:
    image: redis:6-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.0 # Use a specific version
    ports:
      - "9200:9200"
      - "9300:9300"
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m # Adjust memory as needed
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3.9-management-alpine
    ports:
      - "5672:5672"  # AMQP protocol
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - app-network

volumes:
  mysql_data:
  redis_data:
  es_data:
  rabbitmq_data:

networks:
  app-network:
    driver: bridge
